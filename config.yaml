# Non-secret configuration. Secrets (GMAIL_USER, GMAIL_APP_PASSWORD) come from the environment only.
bidding_zone: BE
timezone: Europe/Brussels

# Graph horizon starts at this local time on the run day, whatever the actual run time.
horizon_start_local: "14:00"
# The run exits without doing anything before this local time.
earliest_send_local: "13:00"
# After this local time the email is sent even if tomorrow's prices are still missing.
publication_cutoff_local: "18:00"

charging_duration_hours: 4      # 2, 4, 6 or 8
history_days: 30

recipients:
  - thomasnelis1234@gmail.com
  - t.vandendorpe@outlook.com
  - rosita.hendricks@icloud.com

sources:
  actual: https://api.energy-charts.info
  forecast: https://epexpredictor.batzill.com

# --- CREG reimbursement tariff for home-charging a company car -------------------------------
# Quarterly all-in maximum (energy + network + levies + 6 % btw) set by FOD Financiën from the
# CREG monthly series, with a two-month lag: Q1 = Aug–Oct, Q2 = Nov–Jan, Q3 = Feb–Apr, Q4 = May–Jul.
# Source: https://www.creg.be/nl/consumenten/prijzen-en-tarieven/tarief-voor-terugbetaling-thuisladen-bedrijfswagens
creg:
  region: Vlaanderen
  tariff_c_per_kwh: 32.25        # Q4 2026 Vlaanderen (Brussel 36.88, Wallonië 37.79)
  valid_from: 2026-10-01
  valid_to: 2026-12-31
  based_on: "mei–juli 2026"
  # The runner downloads CREG's monthly CSV and warns in the email when it implies another value
  # for the current quarter, or when the validity period above has passed. Never blocks the email.
  csv_url: https://www.creg.be/sites/default/files/assets/Prices/CREG_Tariff_EV.csv
  check_online: true

# --- What one extra kWh costs on top of the day-ahead price ---------------------------------
# Taken from the ENGIE "Dynamic" tariff sheet, Vlaams Gewest, contracts from November 2026.
# Everything here is per kWh and INCLUDING 6 % btw unless stated otherwise. Fixed yearly amounts
# (vaste vergoeding, databeheer, capaciteitstarief) do not depend on when you charge and are left out.
cost_stack:
  # Energy, EXCLUDING btw, in c€/kWh:  a + b × eSpot_15   (eSpot_15 = day-ahead price in EUR/MWh)
  energy_a: 0.7134
  energy_b: 0.1039
  gsc_wkk_c_per_kwh: 1.582         # Kosten groene stroom & WKK
  green_option_c_per_kwh: 0.0      # "Optie groene stroom" is 1.060 — set it if you took that option
  federal_excise_c_per_kwh: 4.4732 # Federale accijns, alle verbruiken
  flemish_energy_fund_c_per_kwh: 0.0   # Bijdrage Energiefonds: 0 for a residential customer with domicile
  distribution_operator: FLUVIUS LIMBURG     # pick your Fluvius zone from the tables below
  distribution_c_per_kwh:          # "Totaal kWh-tarief" digitale meter, distributie incl. transmissie, 2026
    FLUVIUS ANTWERPEN: 5.35329
    FLUVIUS HALLE-VILVOORDE: 5.63676
    FLUVIUS IMEWO: 5.54236
    FLUVIUS KEMPEN: 6.33708
    FLUVIUS LIMBURG: 5.75257
    FLUVIUS MIDDEN-VLAANDEREN: 5.27945
    FLUVIUS WEST: 6.69853
    FLUVIUS ZENNE-DIJLE: 5.87156
  # Capaciteitstarief: the part of the monthly peak that charging causes, spread over the kWh charged.
  # surcharge (c€/kWh) = tariff (€/kW/year, from the sheet, incl. btw) × extra_peak_kw ÷ kwh_per_year × 100.
  # Set extra_peak_kw to 0 to treat the peak as sunk. A fixed capacity_surcharge_c_per_kwh overrides the formula.
  capacity:
    charger_power_kw: 4.6          # the car is limited to this charging power (informational, shown in the email)
    extra_peak_kw: 2.5             # household ≈ 3 kW on its own, ≈ 5.5 kW while charging
    kwh_per_year: 4000             # kWh charged at home per year
    tariff_eur_per_kw_year:        # "Capaciteitstarief gemiddelde maandpiek", 2026, incl. btw
      FLUVIUS ANTWERPEN: 52.3679
      FLUVIUS HALLE-VILVOORDE: 59.4055
      FLUVIUS IMEWO: 57.4530
      FLUVIUS KEMPEN: 59.5794
      FLUVIUS LIMBURG: 51.9898
      FLUVIUS MIDDEN-VLAANDEREN: 53.1314
      FLUVIUS WEST: 60.5255
      FLUVIUS ZENNE-DIJLE: 59.4902
  vat: 0.06

http:
  timeout_seconds: 30
  retries: 3
  backoff_seconds: 5

smtp:
  host: smtp.gmail.com
  port: 587

state_file: state/runs.json
output_dir: out            # dry-run artifacts (PNG, .eml) land here
